name: Paper figures (reusable)

# Builds the PDFs of the figure pages (figures/src/ -> figures/assets/) once,
# for every job that compiles a document afterwards. paper-build.yml and
# paper-release.yml call it beside the jobs that need no build, and their
# compile jobs wait for it and take the PDFs as the artifact `figure-pages`.
#
# Without it each compile job builds every page itself, through the caller's
# .latexmkrc: the same pages once per document on a pull request, and once per
# job on a release. That path stays as it is -- it is what a fresh clone uses --
# and here it finds every PDF already made.
#
# A repository takes part when its build.sh knows --pdf-only, which is when its
# PDFs are built and no longer committed. Any other repository gets `built`
# empty and its compile jobs run exactly as before.
#
# The PDFs are cached under a key made of everything a page can read: the
# pages, the files beside build.sh and the tikz-tensors pin. A pull request
# that changes no figure restores them and builds nothing. The month is in the
# key so that the pages are rebuilt with the current TeX Live now and then.

on:
  workflow_call:
    outputs:
      built:
        description: "'true' when the artifact figure-pages holds the PDFs; empty when this repository builds none."
        value: ${{ jobs.figures.outputs.built }}

# Runner: a private repository's jobs run on the self-hosted rosina runner (its
# minutes are not billed); a public one's on GitHub-hosted ubuntu-latest, which
# is free for public repositories and keeps a fork's pull request off rosina.
# Steps that differ between the two check runner.environment.

permissions:
  contents: read

jobs:
  figures:
    name: Build figure pages
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    outputs:
      built: ${{ steps.plan.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - name: Does this repository build its figure PDFs?
        id: plan
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "key=figure-pages-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
          else
            echo "No figure page is built here; the documents compile as they are."
          fi

      - name: Restore the PDFs of unchanged pages
        id: cache
        if: steps.plan.outputs.built == 'true'
        uses: actions/cache@v5
        with:
          path: figures/assets/**/*.pdf
          key: ${{ steps.plan.outputs.key }}

      # On the runner, where git is: the LaTeX container then needs neither git
      # nor the network.
      - name: Fetch tikz-tensors
        if: steps.plan.outputs.built == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      # In the same container the documents are compiled in. The action is
      # made to compile one existing file, so the build is its pre_compile
      # and the compile itself is `true <root_file>`, which does nothing.
      - name: Build the pages
        if: steps.plan.outputs.built == 'true' && steps.cache.outputs.cache-hit != 'true' && runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          pre_compile: bash .github/tools/figures/build.sh --pdf-only
          compiler: "true"
          args: ""
          root_file: .github/tools/figures/build.sh

      - name: Build the pages on rosina (the runner's own TeX Live)
        if: steps.plan.outputs.built == 'true' && steps.cache.outputs.cache-hit != 'true' && runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          bash .github/tools/figures/build.sh --pdf-only

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.built == 'true'
        with:
          name: figure-pages
          # Paths are kept from the first wildcard on: <topic>/<page>.pdf.
          path: figures/assets/**/*.pdf
          if-no-files-found: error
          retention-days: 1
