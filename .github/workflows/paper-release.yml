name: Paper release (reusable)

# Releases one document from docs.toml as v<version>-<document>, so each root
# carries its own ladder. The root .tex, build output, tag and asset names are
# all derived from the document id; nothing here enumerates the documents.
#
# Two entry points, one code path. The caller passes `document` and `version`
# when a human dispatches a release; on a pushed tag it passes empty strings and
# the pair is read back out of the tag name. `document` being non-empty is
# therefore the same test as "this run was dispatched", and is also what gates
# tag creation -- a pushed tag already exists.

on:
  workflow_call:
    inputs:
      document:
        description: "Document id as it appears in docs.toml. Empty on a tag push."
        type: string
        required: false
        default: ""
      version:
        description: "Version without 'v' prefix. Empty on a tag push."
        type: string
        required: false
        default: ""
      shelf-repo:
        description: "Repository holding the shelf. Empty to never shelve."
        type: string
        required: false
        default: pen-sotashimozono/paper-shelf
    secrets:
      shelf-deploy-key:
        description: >-
          Write deploy key for the shelf repository. While it is absent the
          shelve job says so and does nothing, so a caller can pass it before it
          exists and creating the secret is the only step left to switch
          shelving on.
        required: false

# Runner: a private repository's jobs run on the self-hosted rosina runner (its
# minutes are not billed); a public one's on GitHub-hosted ubuntu-latest, which
# is free for public repositories and keeps a fork's pull request off rosina.
# Steps that differ between the two check runner.environment.

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.document != '' && format('v{0}-{1}', inputs.version, inputs.document) || github.ref_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve document and verify
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      document: ${{ steps.ver.outputs.document }}
      root: ${{ steps.ver.outputs.root }}
      stem: ${{ steps.ver.outputs.stem }}
      has-supplemental: ${{ steps.check.outputs.has-supplemental }}
      has-draft: ${{ steps.draft.outputs.has-draft }}
    steps:
      - uses: actions/checkout@v7

      # A pushed tag carries the document in its own name, so both entry points
      # end up with the same (document, version) pair and one code path below.
      # The inputs arrive through env rather than ${{ }} inside the script, so a
      # dispatched value is data and never shell.
      - name: Resolve document and tag
        id: ver
        env:
          IN_DOCUMENT: ${{ inputs.document }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$IN_DOCUMENT" ]; then
            DOC="$IN_DOCUMENT"
            VER="$IN_VERSION"
          else
            # v0.0.12-main -> VER=0.0.12, DOC=main. The version cannot hold a
            # hyphen, so the last one always separates the two.
            DOC="${GITHUB_REF_NAME##*-}"
            VER="${GITHUB_REF_NAME%-*}"
            VER="${VER#v}"
          fi

          EXPECTED="$(python3 .github/scripts/docs.py version "$DOC")"
          if [ "$VER" != "$EXPECTED" ]; then
            echo "ERROR: ${DOC} is at ${EXPECTED} in docs.toml, but this release is for ${VER}"
            exit 1
          fi

          ROOT="$(python3 .github/scripts/docs.py root "$DOC")"
          {
            echo "document=${DOC}"
            echo "tag=v${VER}-${DOC}"
            echo "root=${ROOT}"
            echo "stem=$(basename "${ROOT}" .tex)"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag (dispatched runs only)
        if: inputs.document != ''
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Check for supplemental.tex
        id: check
        run: |
          if [ -f supplemental.tex ]; then
            echo "has-supplemental=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-supplemental=false" >> "$GITHUB_OUTPUT"
          fi

      # A root that provides the draft environment (.claude/rules/structure.md)
      # gets a second PDF with the draft marking switched off. Every root
      # carries its own preamble, so the definition is in the root itself.
      - name: Check for a draft environment
        id: draft
        env:
          ROOT: ${{ steps.ver.outputs.root }}
        run: |
          if grep -q '\\newenvironment{draft}' "$ROOT"; then
            echo "has-draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-draft=false" >> "$GITHUB_OUTPUT"
          fi

  build-document:
    name: Build document
    needs: [setup]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # Figure pages. A repository whose build.sh knows --pdf-only builds the
      # PDFs of its figure pages and does not commit them: its .latexmkrc
      # makes the ones that are missing before a document compiles. They are
      # cached here under a key of everything a page can read (the pages, the
      # files beside build.sh, the tikz-tensors pin), so a run that changes no
      # figure builds none. The month is in the key so that they are rebuilt
      # with the current TeX Live now and then. Any other repository skips
      # all of this.
      - name: Does this repository build its figure PDFs?
        id: pages
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "key=figure-pdfs-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
            # Where build.sh writes: figures/generated/, or figures/assets/ in a
            # repository that has not renamed it. Only that directory is cached.
            # Where the name has moved, assets/ holds committed figures made by
            # hand, and restoring a cache over those would put old files in
            # place of the checkout's.
            if grep -qs 'generated/' .github/tools/figures/build.sh; then
              echo "dir=figures/generated" >> "$GITHUB_OUTPUT"
            else
              echo "dir=figures/assets" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the PDFs of the figure pages
        id: pages-cache
        if: steps.pages.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pages.outputs.dir }}/**/*.pdf
          key: ${{ steps.pages.outputs.key }}

      # Restored files keep the time they were built, and the checkout has
      # just stamped every page with the time of this job; .latexmkrc rebuilds
      # a PDF older than its page. The key says they match, so say it in time.
      - name: Mark the restored PDFs newer than their pages
        if: steps.pages-cache.outputs.cache-hit == 'true'
        env:
          DIR: ${{ steps.pages.outputs.dir }}
        run: find "$DIR" -name '*.pdf' -exec touch {} +

      # Nothing restored: the pages are built below, by .latexmkrc. The
      # submodule is fetched here, on the runner, so that the LaTeX container
      # needs neither git nor the network.
      - name: Fetch tikz-tensors
        if: steps.pages.outputs.key != '' && steps.pages-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      - if: runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ needs.setup.outputs.root }}
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out
          # On GitHub-hosted runners this runs inside the container, where
          # latexpand and latexmk live; on rosina, in the step below. The script compiles the bundle in isolation
          # and fails the job if it does not build, so a release cannot ship a
          # tarball that arXiv will reject.
          post_compile: sh .github/scripts/arxiv_bundle.sh "${{ needs.setup.outputs.document }}" arxiv-src

      - name: Compile LaTeX on rosina (the runner's own TeX Live)
        if: runner.environment != 'github-hosted'
        env:
          ROOT: ${{ needs.setup.outputs.root }}
          PRE: |
            mkdir -p out
          POST: sh .github/scripts/arxiv_bundle.sh "${{ needs.setup.outputs.document }}" arxiv-src
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          # latexpand is one Perl script; fetch it into ~/.local/bin once rather
          # than through tlmgr, whose random mirror choice fails intermittently.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v latexpand >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sfL https://mirrors.ctan.org/support/latexpand/latexpand -o "$HOME/.local/bin/latexpand"
            chmod +x "$HOME/.local/bin/latexpand"
          fi
          bash -euo pipefail -c "${PRE:-true}"
          latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode "$ROOT"
          bash -euo pipefail -c "${POST:-true}"

      - name: Hand document over on rosina
        if: runner.environment != 'github-hosted'
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          DIR="$HOME/ci-share/$SHARE/document"
          mkdir -p "$DIR"
          cp "out/${{ needs.setup.outputs.stem }}.pdf" "$DIR/"

      - name: Hand document over as an artifact
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v7
        with:
          name: document
          path: out/${{ needs.setup.outputs.stem }}.pdf
          retention-days: 1

      - name: Hand arxiv-src over on rosina
        if: runner.environment != 'github-hosted'
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          DIR="$HOME/ci-share/$SHARE/arxiv-src"
          mkdir -p "$DIR"
          cp -r "arxiv-src/." "$DIR/"

      - name: Hand arxiv-src over as an artifact
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-src
          path: arxiv-src/
          retention-days: 1

  build-diff:
    name: Build latexdiff PDF
    needs: [setup]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Figure pages. A repository whose build.sh knows --pdf-only builds the
      # PDFs of its figure pages and does not commit them: its .latexmkrc
      # makes the ones that are missing before a document compiles. They are
      # cached here under a key of everything a page can read (the pages, the
      # files beside build.sh, the tikz-tensors pin), so a run that changes no
      # figure builds none. The month is in the key so that they are rebuilt
      # with the current TeX Live now and then. Any other repository skips
      # all of this.
      - name: Does this repository build its figure PDFs?
        id: pages
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "key=figure-pdfs-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
            # Where build.sh writes: figures/generated/, or figures/assets/ in a
            # repository that has not renamed it. Only that directory is cached.
            # Where the name has moved, assets/ holds committed figures made by
            # hand, and restoring a cache over those would put old files in
            # place of the checkout's.
            if grep -qs 'generated/' .github/tools/figures/build.sh; then
              echo "dir=figures/generated" >> "$GITHUB_OUTPUT"
            else
              echo "dir=figures/assets" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the PDFs of the figure pages
        id: pages-cache
        if: steps.pages.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pages.outputs.dir }}/**/*.pdf
          key: ${{ steps.pages.outputs.key }}

      # Restored files keep the time they were built, and the checkout has
      # just stamped every page with the time of this job; .latexmkrc rebuilds
      # a PDF older than its page. The key says they match, so say it in time.
      - name: Mark the restored PDFs newer than their pages
        if: steps.pages-cache.outputs.cache-hit == 'true'
        env:
          DIR: ${{ steps.pages.outputs.dir }}
        run: find "$DIR" -name '*.pdf' -exec touch {} +

      # Nothing restored: the pages are built below, by .latexmkrc. The
      # submodule is fetched here, on the runner, so that the LaTeX container
      # needs neither git nor the network.
      - name: Fetch tikz-tensors
        if: steps.pages.outputs.key != '' && steps.pages-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      # Only this document's own tags: a notes release must diff against the
      # previous notes, not against whatever was tagged most recently.
      - name: Find previous tag for this document
        id: tags
        env:
          DOC: ${{ needs.setup.outputs.document }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          PREV=$(git tag --list "v*-${DOC}" --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"

      # Materialise the previous revision as a directory tree (git only, no TeX
      # on the runner); the flattening itself happens inside the LaTeX
      # container below, which is where latexpand lives.
      - name: Check out the previous revision into prev_rev/
        if: steps.tags.outputs.prev != ''
        run: |
          set -euo pipefail
          mkdir -p prev_rev
          git archive "${{ steps.tags.outputs.prev }}" | tar -x -C prev_rev

      # latexdiff on the root alone shows nothing when the change lives in an
      # \input child, which is where the content sits once the document is
      # split into notes/*.tex — so flatten both revisions first.
      #
      # Three things made this compile fail while the release went on without
      # its diff (the job continues on error), and each is met here:
      #   - A deleted passage keeps its \includegraphics, and a figure that
      #     the new revision no longer has was not found. The files below
      #     figures/ that only the previous revision has are copied in, without
      #     replacing any file of the new one.
      #   - latexdiff marks changes inside a displayed equation term by term,
      #     which breaks alignments. --math-markup=whole sets a changed
      #     equation as a whole, the old one deleted and the new one added.
      #   - A deleted equation keeps its \label in a starred environment, which
      #     amsmath refuses. Inside deleted text \label does nothing
      #     (difflabels.tex, read before \begin{document}); the labels of the
      #     new text are the ones that count.
      - name: Compile latexdiff
        if: steps.tags.outputs.prev != '' && runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: diff.tex
          latexmk_use_lualatex: true
          pre_compile: |
            mkdir -p out
            (cd prev_rev && latexpand "${{ needs.setup.outputs.root }}" > ../prev_flat.tex)
            latexpand "${{ needs.setup.outputs.root }}" > new_flat.tex
            latexdiff --math-markup=whole prev_flat.tex new_flat.tex > diff.tex
            printf '%s\n' '\makeatletter\let\DIFdelwithlabels\DIFdel\DeclareRobustCommand{\DIFdel}[1]{\begingroup\let\label\@gobble\DIFdelwithlabels{#1}\endgroup}\makeatother' > difflabels.tex
            sed 's/^\\begin{document}/\\input{difflabels}\\begin{document}/' diff.tex > diff.tmp && mv diff.tmp diff.tex
            if [ -d prev_rev/figures ]; then
              (cd prev_rev/figures && find . -type f) | while IFS= read -r f; do
                [ -e "figures/$f" ] || { mkdir -p "figures/$(dirname "$f")"; cp "prev_rev/figures/$f" "figures/$f"; }
              done
            fi

      - name: Compile latexdiff on rosina (the runner's own TeX Live)
        if: steps.tags.outputs.prev != '' && runner.environment != 'github-hosted'
        env:
          ROOT: diff.tex
          PRE: |
            mkdir -p out
            (cd prev_rev && latexpand "${{ needs.setup.outputs.root }}" > ../prev_flat.tex)
            latexpand "${{ needs.setup.outputs.root }}" > new_flat.tex
            latexdiff --math-markup=whole prev_flat.tex new_flat.tex > diff.tex
            printf '%s\n' '\makeatletter\let\DIFdelwithlabels\DIFdel\DeclareRobustCommand{\DIFdel}[1]{\begingroup\let\label\@gobble\DIFdelwithlabels{#1}\endgroup}\makeatother' > difflabels.tex
            sed 's/^\\begin{document}/\\input{difflabels}\\begin{document}/' diff.tex > diff.tmp && mv diff.tmp diff.tex
            if [ -d prev_rev/figures ]; then
              (cd prev_rev/figures && find . -type f) | while IFS= read -r f; do
                [ -e "figures/$f" ] || { mkdir -p "figures/$(dirname "$f")"; cp "prev_rev/figures/$f" "figures/$f"; }
              done
            fi
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          # latexpand is one Perl script; fetch it into ~/.local/bin once rather
          # than through tlmgr, whose random mirror choice fails intermittently.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v latexpand >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sfL https://mirrors.ctan.org/support/latexpand/latexpand -o "$HOME/.local/bin/latexpand"
            chmod +x "$HOME/.local/bin/latexpand"
          fi
          bash -euo pipefail -c "${PRE:-true}"
          latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode "$ROOT"
          bash -euo pipefail -c "${POST:-true}"

      - name: Hand diff over on rosina
        if: runner.environment != 'github-hosted' && steps.tags.outputs.prev != ''
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          DIR="$HOME/ci-share/$SHARE/diff"
          mkdir -p "$DIR"
          cp "out/diff.pdf" "$DIR/"

      - name: Hand diff over as an artifact
        if: runner.environment == 'github-hosted' && steps.tags.outputs.prev != ''
        uses: actions/upload-artifact@v7
        with:
          name: diff
          path: out/diff.pdf
          retention-days: 1

  # The released PDF keeps the draft marking (colour, margin flag, closing
  # rule): it is the record of what the author has not yet approved. This job
  # builds the same source with the draft environment redefined to do nothing,
  # for reading. Nothing in the source changes; a two-line wrapper root does
  # the redefinition, so no latexmk option has to reach the container.
  build-clean:
    name: Build PDF without draft marking
    needs: [setup]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    if: needs.setup.outputs.has-draft == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Figure pages. A repository whose build.sh knows --pdf-only builds the
      # PDFs of its figure pages and does not commit them: its .latexmkrc
      # makes the ones that are missing before a document compiles. They are
      # cached here under a key of everything a page can read (the pages, the
      # files beside build.sh, the tikz-tensors pin), so a run that changes no
      # figure builds none. The month is in the key so that they are rebuilt
      # with the current TeX Live now and then. Any other repository skips
      # all of this.
      - name: Does this repository build its figure PDFs?
        id: pages
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "key=figure-pdfs-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
            # Where build.sh writes: figures/generated/, or figures/assets/ in a
            # repository that has not renamed it. Only that directory is cached.
            # Where the name has moved, assets/ holds committed figures made by
            # hand, and restoring a cache over those would put old files in
            # place of the checkout's.
            if grep -qs 'generated/' .github/tools/figures/build.sh; then
              echo "dir=figures/generated" >> "$GITHUB_OUTPUT"
            else
              echo "dir=figures/assets" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the PDFs of the figure pages
        id: pages-cache
        if: steps.pages.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pages.outputs.dir }}/**/*.pdf
          key: ${{ steps.pages.outputs.key }}

      # Restored files keep the time they were built, and the checkout has
      # just stamped every page with the time of this job; .latexmkrc rebuilds
      # a PDF older than its page. The key says they match, so say it in time.
      - name: Mark the restored PDFs newer than their pages
        if: steps.pages-cache.outputs.cache-hit == 'true'
        env:
          DIR: ${{ steps.pages.outputs.dir }}
        run: find "$DIR" -name '*.pdf' -exec touch {} +

      # Nothing restored: the pages are built below, by .latexmkrc. The
      # submodule is fetched here, on the runner, so that the LaTeX container
      # needs neither git nor the network.
      - name: Fetch tikz-tensors
        if: steps.pages.outputs.key != '' && steps.pages-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      - name: Compile without draft marking
        if: runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: clean.tex
          latexmk_use_lualatex: true
          pre_compile: |
            mkdir -p out
            printf '%s\n' '\AtBeginDocument{\renewenvironment{draft}{}{}}' '\input{${{ needs.setup.outputs.root }}}' > clean.tex

      - name: Compile without draft marking on rosina (the runner's own TeX Live)
        if: runner.environment != 'github-hosted'
        env:
          ROOT: clean.tex
          PRE: |
            mkdir -p out
            printf '%s\n' '\AtBeginDocument{\renewenvironment{draft}{}{}}' '\input{${{ needs.setup.outputs.root }}}' > clean.tex
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          bash -euo pipefail -c "${PRE:-true}"
          latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode "$ROOT"

      - name: Hand clean over on rosina
        if: runner.environment != 'github-hosted'
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          DIR="$HOME/ci-share/$SHARE/clean"
          mkdir -p "$DIR"
          cp "out/clean.pdf" "$DIR/"

      - name: Hand clean over as an artifact
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v7
        with:
          name: clean
          path: out/clean.pdf
          retention-days: 1

  build-supplementary:
    name: Build supplementary
    needs: [setup]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    if: needs.setup.outputs.has-supplemental == 'true'
    steps:
      - uses: actions/checkout@v7

      # Figure pages. A repository whose build.sh knows --pdf-only builds the
      # PDFs of its figure pages and does not commit them: its .latexmkrc
      # makes the ones that are missing before a document compiles. They are
      # cached here under a key of everything a page can read (the pages, the
      # files beside build.sh, the tikz-tensors pin), so a run that changes no
      # figure builds none. The month is in the key so that they are rebuilt
      # with the current TeX Live now and then. Any other repository skips
      # all of this.
      - name: Does this repository build its figure PDFs?
        id: pages
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "key=figure-pdfs-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
            # Where build.sh writes: figures/generated/, or figures/assets/ in a
            # repository that has not renamed it. Only that directory is cached.
            # Where the name has moved, assets/ holds committed figures made by
            # hand, and restoring a cache over those would put old files in
            # place of the checkout's.
            if grep -qs 'generated/' .github/tools/figures/build.sh; then
              echo "dir=figures/generated" >> "$GITHUB_OUTPUT"
            else
              echo "dir=figures/assets" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the PDFs of the figure pages
        id: pages-cache
        if: steps.pages.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pages.outputs.dir }}/**/*.pdf
          key: ${{ steps.pages.outputs.key }}

      # Restored files keep the time they were built, and the checkout has
      # just stamped every page with the time of this job; .latexmkrc rebuilds
      # a PDF older than its page. The key says they match, so say it in time.
      - name: Mark the restored PDFs newer than their pages
        if: steps.pages-cache.outputs.cache-hit == 'true'
        env:
          DIR: ${{ steps.pages.outputs.dir }}
        run: find "$DIR" -name '*.pdf' -exec touch {} +

      # Nothing restored: the pages are built below, by .latexmkrc. The
      # submodule is fetched here, on the runner, so that the LaTeX container
      # needs neither git nor the network.
      - name: Fetch tikz-tensors
        if: steps.pages.outputs.key != '' && steps.pages-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      - if: runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: supplemental.tex
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out

      - name: Compile LaTeX on rosina (the runner's own TeX Live)
        if: runner.environment != 'github-hosted'
        env:
          ROOT: supplemental.tex
          PRE: |
            mkdir -p out
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          # latexpand is one Perl script; fetch it into ~/.local/bin once rather
          # than through tlmgr, whose random mirror choice fails intermittently.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v latexpand >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sfL https://mirrors.ctan.org/support/latexpand/latexpand -o "$HOME/.local/bin/latexpand"
            chmod +x "$HOME/.local/bin/latexpand"
          fi
          bash -euo pipefail -c "${PRE:-true}"
          latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode "$ROOT"
          bash -euo pipefail -c "${POST:-true}"

      - name: Hand supplementary over on rosina
        if: runner.environment != 'github-hosted'
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          DIR="$HOME/ci-share/$SHARE/supplementary"
          mkdir -p "$DIR"
          cp "out/supplemental.pdf" "$DIR/"

      - name: Hand supplementary over as an artifact
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v7
        with:
          name: supplementary
          path: out/supplemental.pdf
          retention-days: 1

  release:
    name: GitHub Release
    needs: [setup, build-document, build-diff, build-clean, build-supplementary]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    if: always() && needs.setup.result == 'success' && needs.build-document.result == 'success' && needs.build-diff.result != 'cancelled' && needs.build-clean.result != 'cancelled' && (needs.build-supplementary.result == 'success' || needs.build-supplementary.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The build jobs hand their files over through a directory on rosina,
      # where every runner is one machine, so a release costs no artifact
      # storage; GitHub-hosted runs hand them over as artifacts kept one day.
      # Either way dl/<name>/ holds what job <name> produced.
      - name: Take the build files over on rosina
        if: runner.environment != 'github-hosted'
        env:
          SHARE: ${{ format('{0}/{1}', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -d "$HOME/ci-share/$SHARE" ]; then
            cp -r "$HOME/ci-share/$SHARE/." dl/
          fi
          # The share is ci-share/<owner>/<repo>/<run>, one per run and not per
          # attempt, and it is left in place: a re-run of the failed jobs, this
          # one included, reads what the jobs that passed handed over. Shares
          # older than two days are swept here.
          find "$HOME/ci-share" -mindepth 3 -maxdepth 3 -type d -mtime +2 -exec rm -rf {} + 2>/dev/null || true

      - name: Take the build files over as artifacts
        if: runner.environment == 'github-hosted'
        uses: actions/download-artifact@v8
        with:
          path: dl/

      # Release notes as text: the commit log since this document's previous
      # tag, plus this version's CHANGELOG entry if there is one. Without this
      # the release body is empty and the only way to see what changed is to
      # open a PDF.
      - name: Compose release notes
        env:
          DOC: ${{ needs.setup.outputs.document }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list "v*-${DOC}" --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          {
            if [ -f .github/CHANGELOG.md ]; then
              awk -v v="## ${TAG} " '
                index($0, v) == 1 { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' .github/CHANGELOG.md | sed '/^$/{ x; /./d; x; }'
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "### Commits since ${PREV}"
              echo
              git log --no-merges --format='- %s' "${PREV}..${TAG}" 2>/dev/null || git log --no-merges --format='- %s' "${PREV}..HEAD"
              echo
              echo "Source diff: \`git diff ${PREV} ${TAG} -- '*.tex'\` — or \`./.github/scripts/diff.sh ${PREV} ${TAG}\` for a rendered latexdiff."
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Prepare release assets
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          STEM: ${{ needs.setup.outputs.stem }}
        run: |
          set -euo pipefail
          mkdir release
          if [ -f "dl/document/${STEM}.pdf" ]; then
            mv "dl/document/${STEM}.pdf" "release/${TAG}.pdf"
          fi
          if [ -f dl/diff/diff.pdf ]; then
            mv dl/diff/diff.pdf "release/diff-${TAG}.pdf"
          fi
          if [ -f dl/clean/clean.pdf ]; then
            mv dl/clean/clean.pdf "release/clean-${TAG}.pdf"
          fi
          if [ -f dl/supplementary/supplemental.pdf ]; then
            mv dl/supplementary/supplemental.pdf "release/supplemental-${TAG}.pdf"
          fi
          if [ -d dl/arxiv-src ]; then
            # -r: figures sit below assets/<topic>/, and without it zip stores
            # the directory's name and none of its files.
            (cd dl/arxiv-src && zip -r "../../release/arxiv-bundle-${TAG}.zip" .)
          fi
          echo "Assets:"
          ls -1 release/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: release/*
          body_path: release_notes.md
          generate_release_notes: true

  # Mirrors the PDF this release just published into the shelf, so every
  # document in the organisation is readable from one directory.
  #
  # Inert until the deploy key exists: with no key the job says so and succeeds.
  # Callers pass the secret before it is created, which costs nothing and means
  # switching shelving on is creating one secret and editing nothing.
  #
  # A deploy key rather than a PAT: it writes to the shelf and to nothing else,
  # and it does not expire.
  shelve:
    name: Add to the shelf
    needs: [setup, release]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - name: Is the shelf wired up?
        id: gate
        env:
          KEY: ${{ secrets.shelf-deploy-key }}
          SHELF: ${{ inputs.shelf-repo }}
        run: |
          if [ -n "$KEY" ] && [ -n "$SHELF" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No shelf deploy key configured -- the shelf is left alone."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the shelf
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.shelf-repo }}
          ssh-key: ${{ secrets.shelf-deploy-key }}
          path: shelf

      # Named after the tag because that is what Prepare release assets called
      # it. A failure here fails this job alone -- the release is already out.
      - name: Fetch the PDF this release published
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${TAG}.pdf" --dir shelved

      - name: Install the text extractor
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # rosina already has poppler and no passwordless sudo; pypdf goes to
          # the user site there (Ubuntu's system Python refuses a plain pip install).
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
            python3 -m pip install --quiet --disable-pip-version-check pypdf
          else
            python3 -c "import pypdf" 2>/dev/null ||
              python3 -m pip install --user --break-system-packages --quiet --disable-pip-version-check pypdf
          fi

      # Every attempt starts from the current remote state and re-derives.
      # Releasing two documents at once is two jobs pushing to one shelf, and
      # both rewrite index.json and README.md; rebasing those would conflict,
      # while regenerating them from meta/ once the other commit has landed
      # cannot. shelf.py update reads only this repository, which is all
      # GITHUB_TOKEN can reach.
      - name: Shelve it
        if: steps.gate.outputs.enabled == 'true'
        working-directory: shelf
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard FETCH_HEAD
            python3 scripts/shelf.py update --repo "$REPO" --tag "$TAG" --pdf "${GITHUB_WORKSPACE}/shelved/${TAG}.pdf"
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to add to the shelf."
              exit 0
            fi
            git commit --quiet -m "shelf: ${REPO} ${TAG}"
            if git push --quiet origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push rejected -- another release shelved first. Retrying (${attempt}/3)."
          done
          echo "Could not push to the shelf after three attempts." >&2
          exit 1
