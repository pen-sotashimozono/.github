name: Paper build (reusable)

# Builds every root document in docs.toml, and on a PR checks that the versions
# match what the build says changed. The matrix is generated from the manifest.
#
# The version check lives here rather than in its own workflow because it needs
# the build records latexmk writes (<stem>.fls, <stem>.fdb_latexmk, in the aux
# dir of the caller's .latexmkrc).
# Without them it could only compare root files and would miss every \input
# child. paper-version-check.yml carries the weaker rule that needs no build.
#
# Callers own the on: triggers and delegate the body here. Every checkout below
# runs against the *caller* repository, so docs.toml, the .tex roots and
# .github/scripts/ are read from the repo that calls this workflow -- the
# scripts stay in the caller because bump.sh and diff.sh are also run by hand
# and import docs.py / closure.py from that same directory.

on:
  workflow_call:

# Runner: a private repository's jobs run on the self-hosted rosina runner (its
# minutes are not billed); a public one's on GitHub-hosted ubuntu-latest, which
# is free for public repositories and keeps a fork's pull request off rosina.
# Steps that differ between the two check runner.environment.

permissions:
  contents: read

jobs:
  documents:
    name: Enumerate documents
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          set -euo pipefail
          IDS="$(python3 .github/scripts/docs.py ids --json)"
          echo "Documents: ${IDS}"
          echo "ids=${IDS}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.doc }}
    needs: [documents]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        doc: ${{ fromJSON(needs.documents.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7

      # Figure pages. A repository whose build.sh knows --pdf-only builds the
      # PDFs of its figure pages and does not commit them: its .latexmkrc
      # makes the ones that are missing before a document compiles. They are
      # cached here under a key of everything a page can read (the pages, the
      # files beside build.sh, the tikz-tensors pin), so a run that changes no
      # figure builds none. The month is in the key so that they are rebuilt
      # with the current TeX Live now and then. Any other repository skips
      # all of this.
      - name: Does this repository build its figure PDFs?
        id: pages
        env:
          SOURCES: ${{ hashFiles('figures/src/**', '.github/tools/figures/*') }}
        run: |
          set -euo pipefail
          if grep -qs -- '--pdf-only' .github/tools/figures/build.sh \
              && [ -n "$(find figures/src -name '*.tex' -print -quit 2>/dev/null)" ]; then
            # The submodule is one entry in the tree: its pin.
            PIN="$(git rev-parse -q --verify 'HEAD:.github/tools/figures/tikz-tensors' || echo none)"
            echo "key=figure-pdfs-${RUNNER_ENVIRONMENT}-$(date -u +%Y-%m)-${PIN}-${SOURCES}" >> "$GITHUB_OUTPUT"
            # Where build.sh writes: figures/generated/, or figures/assets/ in a
            # repository that has not renamed it. Only that directory is cached.
            # Where the name has moved, assets/ holds committed figures made by
            # hand, and restoring a cache over those would put old files in
            # place of the checkout's.
            if grep -qs 'generated/' .github/tools/figures/build.sh; then
              echo "dir=figures/generated" >> "$GITHUB_OUTPUT"
            else
              echo "dir=figures/assets" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the PDFs of the figure pages
        id: pages-cache
        if: steps.pages.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pages.outputs.dir }}/**/*.pdf
          key: ${{ steps.pages.outputs.key }}

      # Restored files keep the time they were built, and the checkout has
      # just stamped every page with the time of this job; .latexmkrc rebuilds
      # a PDF older than its page. The key says they match, so say it in time.
      - name: Mark the restored PDFs newer than their pages
        if: steps.pages-cache.outputs.cache-hit == 'true'
        env:
          DIR: ${{ steps.pages.outputs.dir }}
        run: find "$DIR" -name '*.pdf' -exec touch {} +

      # Nothing restored: the pages are built below, by .latexmkrc. The
      # submodule is fetched here, on the runner, so that the LaTeX container
      # needs neither git nor the network.
      - name: Fetch tikz-tensors
        if: steps.pages.outputs.key != '' && steps.pages-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f .github/tools/figures/tikz-tensors.sh ]; then
            sh .github/tools/figures/tikz-tensors.sh ensure
          fi

      - id: doc
        env:
          DOC: ${{ matrix.doc }}
        run: |
          set -euo pipefail
          ROOT="$(python3 .github/scripts/docs.py root "$DOC")"
          echo "root=${ROOT}" >> "$GITHUB_OUTPUT"
          echo "stem=$(basename "$ROOT" .tex)" >> "$GITHUB_OUTPUT"

      # One shared .latexmkrc: every document is LuaLaTeX + BibTeX into out/,
      # and the stems differ, so out/main.* and out/notes.* never collide.
      - name: Compile LaTeX
        if: runner.environment == 'github-hosted'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.doc.outputs.root }}
          latexmk_use_lualatex: true
          pre_compile: |
            mkdir -p out
            lualatex --version
            bibtex --version
          # The submission bundle is checked here, on every PR, rather than
          # only at release: an unflattened bundle fails on arXiv while every
          # build stays green, so nothing else would ever notice it break.
          # Every document, not just the ones headed for arXiv -- the check is
          # really "is this document self-contained once flattened", which is
          # worth knowing either way.
          post_compile: sh .github/scripts/arxiv_bundle.sh "${{ matrix.doc }}" arxiv-check

      - name: Compile LaTeX on rosina (the runner's own TeX Live)
        if: runner.environment != 'github-hosted'
        env:
          ROOT: ${{ steps.doc.outputs.root }}
          PRE: |
            mkdir -p out
          POST: sh .github/scripts/arxiv_bundle.sh "${{ matrix.doc }}" arxiv-check
        run: |
          set -euo pipefail
          # A user-level TeX Live under ~/texlive (no Docker, no sudo on rosina).
          TL="$(ls -d "$HOME"/texlive/*/bin/*-linux 2>/dev/null | sort -V | tail -1)"
          [ -n "$TL" ] || { echo "::error::no TeX Live under ~/texlive on this runner"; exit 1; }
          export PATH="$TL:$PATH"
          # latexpand is one Perl script; fetch it into ~/.local/bin once rather
          # than through tlmgr, whose random mirror choice fails intermittently.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v latexpand >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sfL https://mirrors.ctan.org/support/latexpand/latexpand -o "$HOME/.local/bin/latexpand"
            chmod +x "$HOME/.local/bin/latexpand"
          fi
          bash -euo pipefail -c "${PRE:-true}"
          latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode "$ROOT"
          bash -euo pipefail -c "${POST:-true}"

      # Printed on every PR because the closure must not depend on who built:
      # git is case-sensitive and the Windows filesystem is not, so a locally
      # computed closure can differ from this one.
      - name: Print document closure
        run: python3 .github/scripts/closure.py list "${{ matrix.doc }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.doc }}-pdf
          path: out/${{ steps.doc.outputs.stem }}.pdf
          retention-days: 14

      # Where latexmk keeps its auxiliary files is the caller's .latexmkrc to
      # say (aux_dir.sh reads it); a caller without the script writes to out/.
      - name: Locate the build record
        id: aux
        run: |
          if [ -f .github/scripts/aux_dir.sh ]; then
            echo "dir=$(sh .github/scripts/aux_dir.sh)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=out" >> "$GITHUB_OUTPUT"
          fi

      # Handed to version-check below, which cannot recompute them without
      # running every build a second time.
      - uses: actions/upload-artifact@v7
        with:
          name: build-record-${{ matrix.doc }}
          path: |
            ${{ steps.aux.outputs.dir }}/${{ steps.doc.outputs.stem }}.fls
            ${{ steps.aux.outputs.dir }}/${{ steps.doc.outputs.stem }}.fdb_latexmk
          retention-days: 1

  version-check:
    name: Validate semver bump
    needs: [documents, build]
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: build-record-*
          path: records/
          merge-multiple: true

      - name: Bump exactly the documents this PR touched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp -r records/* out/

          # A full ref, not a shallow one: the closure diff needs a merge base.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE="origin/${BASE_REF}"
          git show "${BASE}:docs.toml" > base-docs.toml 2>/dev/null || : > base-docs.toml

          # Which documents did this branch actually change, through their
          # \input children and references.bib rather than the root file alone?
          AFFECTED="$(python3 .github/scripts/closure.py affected --base "$BASE")"
          if [ -z "$AFFECTED" ]; then
            echo "No document's dependency closure changed — no bump required."
          else
            echo "Affected documents: $(echo "$AFFECTED" | tr '\n' ' ')"
          fi

          # Unquoted on purpose: each id is its own argument, and an empty
          # AFFECTED must reach check-bump as "--only" with zero ids, meaning
          # nothing may bump -- not as "no --only", which would demand all of them.
          python3 .github/scripts/docs.py check-bump --base base-docs.toml --only $AFFECTED
